services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      JUSO_CONFIRM_KEY: ${JUSO_CONFIRM_KEY:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      DEPOSIT_MODEL_PATH: /app/models/deposit-quantile-v2.joblib
      REQUIRE_DEPOSIT_MODEL: "true"
      ANALYSIS_DB_PATH: /app/data/rentguard.db
    volumes:
      - rentguard-data:/app/data

volumes:
  rentguard-data:
