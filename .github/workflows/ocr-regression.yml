name: RentGuard OCR Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: rentguard-ocr-regression
  cancel-in-progress: true

jobs:
  ocr-regression:
    name: OCR 10-case regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            scripts/requirements-pdf.txt

      - name: Install OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.txt
          python -m pip install --disable-pip-version-check -r scripts/requirements-pdf.txt

      - name: Install Korean PDF font
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-nanum

      - name: Generate text and image-only corpora
        run: |
          python scripts/generate_synthetic_document_corpus.py
          python scripts/generate_ocr_document_corpus.py

      - name: Run OCR regression
        run: python scripts/evaluate_ocr_document_corpus.py --min-accuracy 1.0

      - name: Upload OCR evaluation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-ocr-evaluation
          path: output/pdf/rentguard-ocr-corpus/evaluation.json
          if-no-files-found: error
          retention-days: 30
